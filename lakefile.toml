name = "lean_categories"
packagesDir = "../../.local/share/lean/v4.36.0-rc2/packages"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCategories"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The header linter enforces Mathlib's internal copyright-block + module-docstring
# placement convention, which this downstream repo does not adopt; disable just it.
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Mathlib tracks `master` (lean-categories#118): the research image carries one shared
# Lean project, always on the latest Mathlib, and this repository follows it. The exact
# head is pinned by `lake-manifest.json` (which `lake build` resolves from), and
# `.github/workflows/mathlib-head.yml` moves that pin and `lean-toolchain` to each new
# master head and reports breakage there as a failing run.
[[require]]
name = "BrauerGroup"
git = "https://github.com/Whysoserioushah/BrauerGroup.git"
rev = "v4.36.0-rc2"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "LeanCategories"


[[lean_exe]]
name = "lean-categories-axiom-audit"
root = "LeanCategories.Tools.AxiomAuditMain"
supportInterpreter = true

[[lean_exe]]
name = "lean-categories-reference-graph"
root = "LeanCategories.Tools.ReferenceGraphMain"
supportInterpreter = true
