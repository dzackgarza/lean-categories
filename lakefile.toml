name = "lean_categories"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCategories"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The header linter enforces Mathlib's internal copyright-block + module-docstring
# placement convention, which this downstream repo does not adopt; disable just it.
weak.linter.style.header = false
maxSynthPendingDepth = 3

# `BrauerGroup` publishes one tag per Mathlib release and is imported by
# `LeanCategories.Algebra.{CrossedProduct,BrauerGroup}Data`, so its pin has to name the
# release the Mathlib pin below belongs to. The tags are the Lean release Mathlib pins:
# `v4.36.0-rc2` is the tag for Lean `v4.36.0-rc2`, the toolchain of the Mathlib master head.
# A new Mathlib release breaks this package first, which is what the scheduled run reports.
[[require]]
name = "BrauerGroup"
git = "https://github.com/Whysoserioushah/BrauerGroup.git"
rev = "v4.36.0-rc2"

# Mathlib tracks `master` (lean-categories#118): the research image carries one shared
# Lean project, always on the latest Mathlib, and this repository follows it. The exact
# head is pinned by `lake-manifest.json` (which `lake build` resolves from), and
# `.github/workflows/mathlib-head.yml` moves that pin and `lean-toolchain` to each new
# master head and reports breakage there as a failing run. Requiring `mathlib` last
# makes Mathlib's own dependency pins take precedence over the other packages' pins, so
# `lake exe cache get` computes the hashes the build files are keyed to.
#
# Each worktree resolves its own package checkouts (lean-categories#143): with no
# `packagesDir` set, Lake materializes every dependency in this workspace's own
# `.lake/packages`, so a `lake update` or a build in one worktree cannot change or
# delete the packages or `.olean` files another worktree is building against. The
# compressed Mathlib cache in `~/.cache/mathlib` is shared by design, and
# `lake exe cache get` decompresses it into the checkout of the project that runs it,
# so what each worktree holds is its own *source* checkout of the one Mathlib head.
# The decompressed build tree is shared on top of that (lean-categories#148):
# `scripts/cache-get.sh` keeps one build tree per (Mathlib revision, Lean toolchain)
# in the repository's git directory and hands each worktree a tree of hardlinks into
# it, which is what keeps four concurrent worktrees inside one disk. See
# `docs/mathlib-build-store.md` for the measurement and the rejected alternatives.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "LeanCategories"


[[lean_exe]]
name = "lean-categories-axiom-audit"
root = "LeanCategories.Tools.AxiomAuditMain"
supportInterpreter = true

[[lean_exe]]
name = "lean-categories-reference-graph"
root = "LeanCategories.Tools.ReferenceGraphMain"
supportInterpreter = true
