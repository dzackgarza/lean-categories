name = "registry_consumer"
packagesDir = "../../../../.local/share/lean/v4.33.0/packages"
version = "0.1.0"
defaultTargets = ["RegistryConsumer"]

# The pinned dependency is the whole point of this package: the consumer reads the checked
# catalogue of that revision and nothing else. A release is pinned either by tag (the
# published form) or by `rev` (a commit) when no tag exists yet.
[[require]]
name = "lean_categories"
path = "../.."

[[lean_lib]]
name = "RegistryConsumer"
