name: Mathlib head

# lean-categories#118: this repository follows Mathlib `master`, as the research image's
# shared Lean project does. The lakefile requires Mathlib at `master`; the *exact* head is
# pinned by `lake-manifest.json` (which `lake build` resolves from) together with the
# `lean-toolchain` Mathlib pins, and this job moves those two files to each new head.
#
# NOT LANDED: the connection used for #118 has no `workflows` permission, so this file
# could not be pushed to `.github/workflows/`. It is kept here as the source of
# `results/mathlib-head.workflow.patch`; land that patch (or copy this file to
# `.github/workflows/mathlib-head.yml`) to enable the scheduled move.
#
# It moves the pins only through the complete repository gate (`just test-ci`), so `main`
# always names a head that passed it. Breakage at a new head is reported by this run
# failing, with the head it broke at in the log and the job summary — not by a red `main`
# and not by a stale pin going unnoticed. Re-running the job (or dispatching it) retries the
# current head, and a later green run moves the pins past a broken one.

'on':
  schedule:
    # Daily. Mathlib merges most days; one run per day is enough to keep the pin fresh.
    - cron: '17 5 * * *'
  workflow_dispatch:

# The pins are pushed, so the token needs write access to the contents.
permissions:
  contents: write

# Never run two movers at once: both would push a manifest.
concurrency:
  group: mathlib-head
  cancel-in-progress: false

jobs:
  move-pins:
    name: Move the pins to the Mathlib master head and run the gate
    runs-on: ubuntu-latest
    # Budget: toolchain + Mathlib cache download, then the full Library build and audits.
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Keep the credential so the moved pins can be pushed back.
          persist-credentials: true

      - name: Clone QC infrastructure
        run: git clone --depth 1 https://github.com/dzackgarza/ai-review-ci.git "$HOME/ai-review-ci"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          # The cache is fetched by `just test-ci`'s `build` recipe, after the move, so that
          # it is fetched for the *new* head rather than for the pin being replaced.
          use-mathlib-cache: 'false'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: 1.58.0

      - name: Move the pins to the current Mathlib master head
        run: |
          set -euo pipefail
          # `lake update` re-resolves the lakefile's `master` to the head it names now and
          # rewrites `lake-manifest.json`. `BrauerGroup`'s tag tracks the Mathlib release the
          # image carries, so it is moved with it (`lake update` resolves both).
          lake update
          # The toolchain follows the one Mathlib pins, read from the resolved package rather
          # than relying on `lake update` to rewrite the file.
          pkgdir="$(python3 -c 'import json; d = json.load(open("lake-manifest.json")); print(d.get("packagesDir") or ".lake/packages")')"
          mathlib_dir="$pkgdir/mathlib"
          head="$(git -C "$mathlib_dir" rev-parse HEAD)"
          cp "$mathlib_dir/lean-toolchain" lean-toolchain
          echo "MATHLIB_HEAD=$head" >> "$GITHUB_ENV"
          echo "MATHLIB_DIR=$mathlib_dir" >> "$GITHUB_ENV"
          echo "Moving to Mathlib $head, toolchain $(tr -d '\n' < lean-toolchain)" >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff --stat

      - name: Run the repository gate at the new head
        run: just test-ci

      - name: Commit and push the moved pins
        run: |
          set -euo pipefail
          if git diff --quiet -- lean-toolchain lake-manifest.json; then
            echo "The pins already name Mathlib $MATHLIB_HEAD; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "mathlib-head"
          git config user.email "mathlib-head@users.noreply.github.com"
          git add lean-toolchain lake-manifest.json
          git commit -m "Follow Mathlib master to $(git -C "$MATHLIB_DIR" rev-parse --short HEAD)"
          git push origin HEAD:refs/heads/main

      - name: Report the head it broke at
        if: failure()
        run: |
          head="${MATHLIB_HEAD:-unknown}"
          toolchain="$(tr -d '\n' < lean-toolchain || true)"
          echo "::error::The repository does not pass its gate at Mathlib $head (toolchain $toolchain). The pins were left where they are."
          {
            echo "### Breakage at Mathlib \`$head\`"
            echo
            echo "Toolchain \`$toolchain\`. The pins were not moved; \`main\` still names the last head that passed."
          } >> "$GITHUB_STEP_SUMMARY"
